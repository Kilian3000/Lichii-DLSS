<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <name>switch2</name>
    <fullname>Nintendo Switch 2</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>2025</release>
    <hardware>console</hardware>
    <path>/userdata/roms/switch2</path>
    <extension>.nup .nsp .xci .nsz .xcz .switch2</extension>
    <command>/userdata/system/lichii/launch.sh --emulator %EMULATOR% %ROM%</command>
    <theme>switch2</theme>
    <emulators>
      <emulator name="lichii">
        <cores>
          <core default="true">lichii</core>
        </cores>
      </emulator>
      <emulator name="eglantine">
        <cores>
          <core default="true">eglantine</core>
        </cores>
      </emulator>
      <emulator name="lichii-dlss">
        <cores>
          <core default="true">lichii-dlss</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
