<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="lichii" features="">
    <feature name="FRAME GENERATION" value="lichii_frame_generation" description="Built-in optical-flow frame generation. 2x, 3x or 4x adds interpolated frames; it does not increase game simulation speed. Auto inherits existing settings. Applies on the next game launch.">
      <choice name="Off" value="off" />
      <choice name="2x" value="2" />
      <choice name="3x" value="3" />
      <choice name="4x" value="4" />
    </feature>
  </emulator>
  <emulator name="eglantine" features="" />
  <emulator name="lichii-dlss" features="">
    <feature name="FRAME GENERATION" value="lichii_frame_generation" description="Built-in optical-flow frame generation. 2x, 3x or 4x adds interpolated frames; it does not increase game simulation speed. Auto inherits existing settings. Applies on the next game launch.">
      <choice name="Off" value="off" />
      <choice name="2x" value="2" />
      <choice name="3x" value="3" />
      <choice name="4x" value="4" />
    </feature>
    <feature name="DLSS NEURAL RENDERING" value="lichii_dlss_neural" description="AI lighting and detail enhancement. Off keeps ordinary DLSS and frees neural GPU resources. Auto uses the emulator settings. Applies on the next game launch.">
      <choice name="Off (ordinary DLSS)" value="off" />
      <choice name="Standard" value="standard" />
      <choice name="Natural" value="natural" />
      <choice name="Cinematic" value="cinematic" />
    </feature>
    <feature name="DLSS QUALITY MODE" value="lichii_dlss_quality" description="Game resolution follows the game target. Native DLAA keeps the render resolution and can reduce neural GPU work. Other modes depend on game support.">
      <choice name="Game resolution" value="game" />
      <choice name="Native DLAA" value="native" />
      <choice name="Quality" value="quality" />
      <choice name="Balanced" value="balanced" />
      <choice name="Performance" value="performance" />
      <choice name="Ultra Performance" value="ultra" />
    </feature>
    <feature name="NEURAL EFFECT STRENGTH" value="lichii_dlss_neural_strength" description="Blend the neural look with ordinary DLSS. Lower strength does not reduce GPU work; select Neural Rendering Off to recover performance.">
      <choice name="25%" value="25" />
      <choice name="50%" value="50" />
      <choice name="75%" value="75" />
      <choice name="100%" value="100" />
    </feature>
  </emulator>
</features>
